<!DOCTYPE html>
<html>
  <head>
    <title>DARK OPS FPS Game Open Beta</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="header">
      <h1 id="title">DARK OPS FPS Game Open Beta</h1>   
      <p id="description"><i>
        Thank you for joining the <b>Open Beta</b>.Your <b>feedback</b> will help us <b>improve</b> your experience before launch.</i>
      </p>
    </div>
    <div class="Q">
      <form id="survey-form">
        <fieldset>
          <label id="name-label" for="name">Name 
            <input id="name" type="text" placeholder="Enter your name" required>
          </label>
          <label id="email-label" for="email">email 
            <input id="email" type="email" placeholder="Enter your email" required>
          </label>
          <label id="number-label" for="number">Your age 
            <input id="number" type="number" min="16" max="80" placeholder="Age">
          </label>
        </fieldset>
        <fieldset>
          <label for="dropdown">Which gamemode did you play most?
            <select id="dropdown">
              <option>Select gamemode</option>
              <option>Multiplayer</option>
              <option>Coop Zombies</option>
              <option>Both</option>
            </select>
          </label>
        </fieldset>
        <fieldset>
          <legend>Was your experience overall enjoyable?</legend>
          <label for="yes">
            <input id="yes" name="experience" value="yes" 
                type="radio" checked>Yes
          </label>
          <label for="somewhat">
            <input id="somewhat" value="somewhat" type="radio" name="experience">Somewhat
          </label>
          <label for="no">
            <input id="no" value="no" type="radio" 
              name="experience">No
          </label>
        </fieldset>
        <fieldset>
          <legend> Select which of these issues did you encounter:</legend>
          <label for="spawns">
            <input id="spawns" value="Bad Spawns" 
              type="checkbox">Bad Spawns
          </label>
          <label for="ktime">
            <input id="ktime" type="checkbox" 
              value="kill time fast">Time to kill too fast
          </label>
          <label for="hitreg">
            <input id="hitreg" type="checkbox" 
              value="bad hitreg">Bad Hit Registration
          </label>
          <label for="crash">
            <input id="crash" type="checkbox" 
              value="game crash">Game crash
          </label>

          <label class="issues" for="more-errors">Other issues?
            <textarea id="more-errors" placeholder="Describe them here..." rows="4" cols="35"></textarea>
          </label>
        </fieldset>
        <label>
          <input id="submit" type="submit" value="submit">
        </label>
      </form>
    </div>
  </body>
</html>
